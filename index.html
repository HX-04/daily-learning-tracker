<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>今晚学到了 · 每日学习打卡</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffb454'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%230f1115' font-family='sans-serif' font-weight='bold'%3E30%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f2430; --line:#2a3140;
    --txt:#e8ecf3; --mut:#9aa4b5; --accent:#ffb454; --ok:#4ade80; --bad:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6;
    min-height:100vh; padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:480px; margin:0 auto; padding:16px 16px 0;}
  header{display:flex; align-items:center; justify-content:space-between; padding:8px 2px 14px;}
  .title{font-size:20px; font-weight:800; letter-spacing:.3px;}
  .title small{display:block; font-size:11px; color:var(--mut); font-weight:500; margin-top:2px;}
  .streak{
    background:linear-gradient(135deg,#ffb454,#ff8f3d); color:#17130a;
    font-weight:800; font-size:15px; padding:8px 14px; border-radius:999px;
    box-shadow:0 4px 18px rgba(255,164,74,.25);
  }
  .streak span{font-size:11px; font-weight:600; opacity:.8;}
  .banner{
    display:none; margin-bottom:12px; padding:11px 14px; border-radius:var(--radius);
    background:rgba(255,180,84,.12); border:1px solid rgba(255,180,84,.35);
    color:var(--accent); font-size:13px;
  }
  .banner.show{display:block; animation:pop .25s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(-4px)} to{opacity:1}}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .card h2{margin:0 0 4px; font-size:15px; font-weight:700;}
  .card .sub{margin:0 0 12px; font-size:12px; color:var(--mut);}
  label{display:block; font-size:12px; color:var(--mut); margin:10px 0 5px;}
  textarea, input[type=text]{
    width:100%; background:var(--card2); border:1px solid var(--line);
    color:var(--txt); border-radius:12px; padding:11px 12px; font-size:15px;
    font-family:inherit; resize:vertical;
  }
  textarea{min-height:58px}
  textarea:focus, input:focus{outline:none; border-color:var(--accent);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:12px;
    background:var(--accent); color:#17130a; font-size:16px; font-weight:800;
    cursor:pointer; transition:transform .08s;
  }
  .btn:active{transform:scale(.97)}
  .btn.done{background:var(--ok); color:#0a2013;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--mut); font-weight:600; font-size:13px; padding:9px;}
  .row{display:flex; gap:8px; margin-top:10px;}
  .row input{flex:1; margin:0;}
  .row .btn{width:auto; margin:0; padding:11px 16px;}
  .cmdlist{list-style:none; margin:12px 0 0; padding:0;}
  .cmdlist li{
    display:flex; align-items:flex-start; gap:8px;
    background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:9px 11px; margin-bottom:8px; font-size:14px;
  }
  .cmdlist .d{color:var(--mut); font-size:11px; white-space:nowrap; padding-top:2px; flex:none;}
  .cmdlist .t{flex:1; word-break:break-word;}
  .cmdlist button{background:none; border:none; color:var(--bad); font-size:14px; cursor:pointer; padding:0 2px;}
  .cmdlist button:disabled{opacity:.25}
  .grid14{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px;}
  .day{
    text-align:center; padding:7px 0; border-radius:10px; font-size:12px; font-weight:600;
    background:var(--card2); color:var(--mut);
  }
  .day.done{background:rgba(74,222,128,.16); color:var(--ok);}
  .day.today{border:1.5px solid var(--accent); color:var(--accent);}
  .stats{display:flex; gap:10px; margin-bottom:14px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; text-align:center;}
  .stat b{display:block; font-size:22px; font-weight:800;}
  .stat span{font-size:11px; color:var(--mut);}
  .tools{display:flex; gap:8px;}
  .tools .btn{width:auto; flex:1;}
  .tip{font-size:12px; color:var(--mut); margin-top:14px; text-align:center; line-height:1.7;}
  .saved-toast{position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--ok); color:#0a2013; font-weight:700; padding:10px 18px; border-radius:999px;
    opacity:0; transition:.25s; font-size:14px; pointer-events:none; z-index:99;}
  .saved-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">今晚学到了<small id="dateLabel">·</small></div>
    <div class="streak"><span>🔥 连续</span> <b id="streakNum">0</b><span> 天</span></div>
  </header>

  <div class="banner" id="remindBanner">⏰ 今天还没打卡 —— 睡前花 3 分钟，把学到的东西写下来</div>

  <div class="stats">
    <div class="stat"><b id="statStreak">0</b><span>当前连续</span></div>
    <div class="stat"><b id="statTotal">0</b><span>累计打卡</span></div>
    <div class="stat"><b id="statCmd">0</b><span>速记条数</span></div>
  </div>

  <div class="card">
    <h2>最近 14 天</h2>
    <div class="grid14" id="grid14"></div>
  </div>

  <div class="card">
    <h2>✍️ 今天的打卡</h2>
    <p class="sub">睡前把今天学的东西交代一下，就是给自己一个交代。</p>
    <label for="inLearned">今天学到了什么？</label>
    <textarea id="inLearned" placeholder="例如：Shift+A 添加物体；E 挤出；S 缩放…"></textarea>
    <label for="inStuck">卡在哪里？</label>
    <textarea id="inStuck" placeholder="没弄懂的地方，写下来明天解决"></textarea>
    <label for="inNext">明天打算试什么？</label>
    <textarea id="inNext" placeholder="一句话就行"></textarea>
    <button class="btn" id="btnSave">✓ 保存今天的打卡</button>
  </div>

  <div class="card">
    <h2>⚡ 指令 / 技巧速记</h2>
    <p class="sub">随时想到就记一条（像当年学 CAD 那样）</p>
    <div class="row">
      <input type="text" id="inCmd" placeholder="例如：E = 挤出面">
      <button class="btn" id="btnAdd">记下</button>
    </div>
    <ul class="cmdlist" id="cmdList"></ul>
  </div>

  <div class="card">
    <h2>🔧 数据</h2>
    <p class="sub">换手机/清缓存前，记得导出备份</p>
    <div class="tools">
      <button class="btn ghost" id="btnExport">导出备份</button>
      <button class="btn ghost" id="btnImport">导入备份</button>
      <input type="file" id="fileImport" class="hidden" accept=".json">
    </div>
  </div>

  <div class="tip">
    💡 提醒靠手机自带闹钟：设一个每晚 22:30 的「睡前打卡」闹钟。<br>
    这样即使今天只学了 15 分钟，睡前也能留下 3 行字。
  </div>
</div>

<div class="saved-toast" id="toast">✓ 已保存</div>

<script>
(function(){
  var K_ENT='jn_entries', K_CMD='jn_commands';
  var entries=load(K_ENT,{});
  var commands=load(K_CMD,[]);

  function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }
  function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function toStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayStr(){ return toStr(new Date()); }
  function fmtDate(){ var d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]; }
  var $=function(id){ return document.getElementById(id); };

  function computeStreak(){
    var s=0, d=new Date();
    if(!entries[toStr(d)]) d.setDate(d.getDate()-1);
    while(entries[toStr(d)]){ s++; d.setDate(d.getDate()-1); }
    return s;
  }
  function renderAll(){
    $('dateLabel').textContent=fmtDate();
    $('streakNum').textContent=computeStreak();
    $('statStreak').textContent=computeStreak();
    $('statTotal').textContent=Object.keys(entries).length;
    $('statCmd').textContent=commands.length;
    renderGrid(); renderForm(); renderCmds();
    var done=!!entries[todayStr()];
    $('remindBanner').classList.toggle('show', !done);
    $('btnSave').textContent = done ? '✓ 今天已打卡 · 点这里修改' : '✓ 保存今天的打卡';
    $('btnSave').classList.toggle('done', done);
  }
  function renderGrid(){
    var el=$('grid14'); el.innerHTML='';
    for(var i=13;i>=0;i--){
      var d=new Date(); d.setDate(d.getDate()-i);
      var s=toStr(d), cell=document.createElement('div');
      cell.className='day'+(entries[s]?' done':'')+(s===todayStr()?' today':'');
      cell.textContent=d.getDate();
      cell.title=s+(entries[s]?' · 已打卡':'');
      el.appendChild(cell);
    }
  }
  function renderForm(){
    var e=entries[todayStr()]||{};
    $('inLearned').value=e.learned||'';
    $('inStuck').value=e.stuck||'';
    $('inNext').value=e.next||'';
  }
  function renderCmds(){
    var el=$('cmdList'); el.innerHTML='';
    commands.slice(0,50).forEach(function(c,i){
      var li=document.createElement('li');
      var d=document.createElement('span'); d.className='d'; d.textContent=c.date.slice(5);
      var t=document.createElement('span'); t.className='t'; t.textContent=c.text;
      var btn=document.createElement('button'); btn.textContent='✕';
      btn.title='删除这条';
      btn.addEventListener('click', function(){
        commands.splice(i,1); save(K_CMD,commands); renderAll();
      });
      li.appendChild(d); li.appendChild(t); li.appendChild(btn);
      el.appendChild(li);
    });
    if(!commands.length){ el.innerHTML='<li style="color:var(--mut)">还没有速记，学到一个指令就记一条 ✍️</li>'; }
  }
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },1600);
  }
  $('btnSave').addEventListener('click', function(){
    entries[todayStr()]={ learned:$('inLearned').value.trim(), stuck:$('inStuck').value.trim(), next:$('inNext').value.trim() };
    save(K_ENT,entries); renderAll(); toast('✓ 打卡已保存');
  });
  $('btnAdd').addEventListener('click', function(){
    var v=$('inCmd').value.trim(); if(!v) return;
    commands.unshift({date:todayStr(), text:v});
    save(K_CMD,commands); $('inCmd').value=''; renderAll(); toast('✓ 记下了');
  });
  $('inCmd').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); $('btnAdd').click(); } });
  $('btnExport').addEventListener('click', function(){
    var blob=new Blob([JSON.stringify({entries:entries,commands:commands},null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='学习打卡备份_'+todayStr()+'.json'; a.click();
    URL.revokeObjectURL(a.href); toast('✓ 备份已导出');
  });
  $('btnImport').addEventListener('click', function(){ $('fileImport').click(); });
  $('fileImport').addEventListener('change', function(){
    var f=this.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(data.entries) entries=data.entries;
        if(data.commands) commands=data.commands;
        save(K_ENT,entries); save(K_CMD,commands); renderAll(); toast('✓ 导入成功');
      }catch(e){ toast('✗ 备份文件格式不对'); }
    };
    r.readAsText(f); this.value='';
  });

  // 注册 Service Worker（需要 HTTPS 才能生效，本地直接打开不影响使用）
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  renderAll();
})();
</script>
</body>
</html>
